<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen Launcher</title>
<meta name="viewport" content="width=1920, initial-scale=1">
<style>
@font-face{font-family:'Outfit';font-weight:300;font-style:normal;font-display:swap;src:url(fonts/outfit-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Outfit';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/outfit-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Figtree';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/figtree-latin-600-normal.woff2) format('woff2')}
</style>
<style>
/* Layout: fixed 1920x1080 TV stage scaled to the window; low-res canvas backdrop (blur for free), hero copy top-left, card rows anchored low. */
:root{
  --bg:#06080c;
  --fg:#f3f5f9;
  --muted:rgba(226,233,245,.64);
  --faint:rgba(226,233,245,.36);
  --panel:#0e1117;
  --pill:#f3f5f9;
  --pill-ink:#0a0c11;
  --accent:#8fd3ff;
  --accent-glow:rgba(143,211,255,.5);
  --font-display:'Outfit','LG Smart UI','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','LG Smart UI','Segoe UI',system-ui,sans-serif;
  --radius:18px; --scale:1.1; --dur:.3s;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;color:var(--fg);font-family:var(--font-body);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default;background:var(--bg)}

/* ---------- backdrop: two small canvases, upscaled = blurred, cross-faded by opacity only ---------- */
.bd{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;transition:opacity .5s ease;will-change:opacity}
.bd.on{opacity:1}
#stage.lite .bd,#stage.boot .bd{transition:none}

/* ---------- top bar ---------- */
#top{position:absolute;top:54px;right:96px;display:flex;align-items:center;z-index:5;transition:opacity .3s}
#clock{text-align:right;margin-right:16px}
/* weather: same two lines as the clock, to its left: icon + temperature, then today's high and low */
#wx{text-align:right;margin-right:44px;transition:opacity .4s}
#wx-now{display:flex;align-items:center;justify-content:flex-end;height:58px}
#wx-icon svg{width:46px;height:46px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;margin-right:12px;display:block}
#wx-temp{font-family:var(--font-display);font-weight:300;font-size:58px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#wx-range{font-size:22px;color:var(--muted);margin-top:8px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#time{font-family:var(--font-display);font-weight:300;font-size:58px;line-height:1;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#time .ampm{font-size:24px;font-weight:500;margin-left:8px;letter-spacing:.06em;color:var(--muted)}
#date{font-size:22px;color:var(--muted);margin-top:8px;letter-spacing:.02em}
.tbtn{position:relative;width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);transition:transform var(--dur),background-color var(--dur),color var(--dur);color:var(--fg);margin-left:18px}
.tbtn svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tbtn.focus{background:var(--pill);color:var(--pill-ink);transform:scale(1.14)}
/* name under the focused button; scaled back so it stays at its own size */
.tl{position:absolute;top:100%;right:50%;margin-top:14px;transform:translate3d(50%,-6px,0) scale(.88);white-space:nowrap;font-size:21px;font-weight:600;color:var(--fg);opacity:0;transition:opacity var(--dur),transform var(--dur);text-shadow:0 1px 10px rgba(0,0,0,.6);pointer-events:none}
.tbtn.focus .tl{opacity:1;transform:translate3d(50%,0,0) scale(.88)}
#stage.top-on #credit{opacity:0}
#stage.no-clock #clock{display:none}
#stage.no-date #date{display:none}

/* ---------- hero ---------- */
#hero{position:absolute;left:120px;top:164px;width:1000px;z-index:2;transition:opacity var(--dur)}
#stage.no-hero #hero{opacity:0}
/* title first, then one quiet line of facts in the accent colour, then the description */
#title{font-family:var(--font-display);font-weight:500;font-size:96px;line-height:1.04;letter-spacing:-.025em;margin:0;padding-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#eyebrow{font-size:25px;font-weight:600;letter-spacing:.01em;color:var(--accent);height:32px;margin-top:10px;transition:color .5s ease}
#desc{font-size:28px;line-height:1.42;color:var(--muted);margin-top:14px;max-width:820px;height:80px;overflow:hidden}
#hero.swapA .hx{animation:heroA .42s cubic-bezier(.2,.8,.2,1) both}
#hero.swapB .hx{animation:heroB .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes heroA{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
@keyframes heroB{from{opacity:0;transform:translate3d(0,12px,0)}to{opacity:1;transform:none}}
#stage.lite #hero .hx{animation:none!important}

/* ---------- rows ---------- */
/* peek (Up from the first row, and while the top buttons have focus): cards slide down and fade */
#rowsWrap{position:absolute;left:0;right:0;top:0;z-index:3;transition:transform .6s cubic-bezier(.25,.8,.25,1),opacity .6s ease;will-change:transform,opacity}
#stage.peek #rowsWrap{transform:translate3d(0,170px,0);opacity:.16}
#stage.peek-bg #hero,#stage.peek-bg #hints{opacity:0}
#stage.peek-bg #phShade{opacity:.45}
#phShade{transition:opacity .6s ease;will-change:opacity}
#hero{transition:opacity .45s ease}
#stage.speed-off #rowsWrap,#stage.speed-off #phShade,#stage.speed-off #hero{transition:none}
#rows{position:absolute;left:0;right:0;top:0;transition:transform var(--dur) cubic-bezier(.2,.8,.2,1);z-index:3;will-change:transform}
.row{padding-left:120px;margin-bottom:54px;transition:opacity var(--dur)}
.row.above{opacity:0}
.row-title{font-family:var(--font-display);font-weight:500;font-size:27px;color:var(--muted);margin-bottom:32px;letter-spacing:.01em;height:34px}
.row.cur .row-title{color:var(--fg)}
#stage.no-row-titles .row-title{display:none}
.track{display:flex;transition:transform var(--dur) cubic-bezier(.2,.8,.2,1);will-change:transform}
.card{flex:none;margin-right:38px;position:relative}
.lift{position:relative;transition:transform var(--dur) cubic-bezier(.2,.8,.2,1);--rx:0deg;--ry:0deg;will-change:transform}
.halo{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:var(--radius);opacity:0;transition:opacity var(--dur);box-shadow:0 24px 42px rgba(0,0,0,.58);will-change:opacity}
.face{position:relative;border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.32)}
/* gloss sits below the light sweep: on top of it, it forced both to be redrawn on every move */
.face::after{content:"";position:absolute;z-index:0;top:0;left:0;right:0;bottom:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 38%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);pointer-events:none}
.art{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center}
.art svg{height:40%;width:auto;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.art img{max-width:50%;max-height:62%}
.art.seam img{width:88%;height:88%;max-width:none;max-height:none;object-fit:contain}
.art.tile img{max-width:62%;max-height:74%;border-radius:22px}
#stage.style-icon .art.tile img{max-width:82%;max-height:82%}
.art.splash img,.art.splash svg{display:none}
/* named cards (inputs): glyph top-left, name bottom-left, readable without focus */
.art.nm{flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:0 26px 22px;box-sizing:border-box}
.art.nm svg{position:absolute;left:24px;top:22px;height:30%;stroke-width:1.6;opacity:.95}
.nm-t{font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.1;letter-spacing:-.01em;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage.style-icon .art.nm{padding:0 16px 14px}
#stage.style-icon .art.nm svg{left:16px;top:16px;height:28%}
#stage.style-icon .nm-t{font-size:21px}
#stage.style-poster .art.nm svg{height:20%}
.sheen{position:absolute;z-index:1;top:-20%;bottom:-20%;left:0;width:60%;background:linear-gradient(105deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.24) 50%,rgba(255,255,255,0) 100%);transform:translate3d(-160%,0,0) skewX(-12deg);pointer-events:none;will-change:transform}
.card.focus .sheen{animation:sheen 1.1s cubic-bezier(.3,.6,.3,1) .15s 1 both}
@keyframes sheen{from{transform:translate3d(-160%,0,0) skewX(-12deg)}to{transform:translate3d(260%,0,0) skewX(-12deg)}}
#stage.lite .sheen{display:none}
#stage.glide .track,#stage.glide #rows{transition-duration:.15s;transition-timing-function:linear}
#stage.glide .lift,#stage.glide .halo,#stage.glide .label{transition-duration:.15s}
#stage.glide .card.focus .sheen{animation:none}
.label{margin-top:22px;font-size:24px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity var(--dur),transform var(--dur) cubic-bezier(.2,.8,.2,1)}
#stage.labels-focus .card:not(.focus) .label{opacity:0}
#stage.labels-never .label{display:none}
.card.focus .label{color:var(--fg);transform:translate3d(0,calc((var(--scale) - 1) * var(--h) / 2 - 2px),0)}

/* focus effects: transform + opacity only, nothing that repaints while animating */
.card.focus .lift{transform:translate3d(0,-6px,0) scale(var(--scale));z-index:2}
#stage.tilt .card.focus .lift{transform:perspective(1000px) rotateX(var(--rx)) rotateY(var(--ry)) translate3d(0,-6px,0) scale(var(--scale))}
.card.focus .halo{opacity:1}
#stage.fx-glow .halo{box-shadow:0 0 50px 8px var(--accent-glow),0 26px 50px rgba(0,0,0,.5)}
#stage.fx-outline .card.focus .lift{transform:scale(calc(1 + (var(--scale) - 1) * .5))}
#stage.fx-outline .halo{box-shadow:0 0 0 5px var(--accent),0 16px 36px rgba(0,0,0,.45)}
#stage.fx-frame .halo{box-shadow:0 0 0 5px var(--accent),0 24px 42px rgba(0,0,0,.56)}
#stage.lite .face{box-shadow:none}
#stage.lite.fx-lift .halo,#stage.lite.fx-glow .halo{box-shadow:0 0 0 4px rgba(255,255,255,.9)}
#stage.style-icon .art svg{height:46%}

/* move mode */
.card.moving .lift{animation:wig .22s ease-in-out infinite alternate}
@keyframes wig{from{transform:translate3d(0,-6px,0) scale(var(--scale)) rotate(-1.4deg)}to{transform:translate3d(0,-6px,0) scale(var(--scale)) rotate(1.4deg)}}
.card.moving .nudge{display:flex}
.nudge{display:none;position:absolute;top:0;left:-30px;right:-30px;height:var(--h);justify-content:space-between;align-items:center;pointer-events:none;z-index:4}
.nudge span{width:44px;height:44px;border-radius:50%;background:var(--pill);color:var(--pill-ink);display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}

/* ---------- hints / banner / toast / fps ---------- */
#hints{position:absolute;left:120px;top:66px;display:flex;align-items:center;font-size:20px;color:var(--faint);z-index:4;transition:opacity .3s}
#hints .k{display:inline-block;min-width:34px;padding:4px 10px;margin-right:10px;border-radius:8px;background:rgba(255,255,255,.1);color:var(--muted);font-weight:600;font-size:17px;text-align:center;letter-spacing:.04em}
#hints .h{margin-right:36px}
#stage.no-hints #hints,#stage.has-banner #hints{opacity:0}
#banner{position:absolute;left:120px;top:52px;max-width:1150px;padding:14px 22px;border-radius:14px;background:rgba(255,160,90,.16);color:#ffd2b0;font-size:21px;line-height:1.4;z-index:6}
#toast{position:absolute;left:50%;bottom:90px;transform:translate3d(-50%,30px,0);padding:18px 30px;border-radius:999px;background:var(--panel);font-size:24px;opacity:0;transition:opacity .3s,transform .3s;z-index:30;white-space:nowrap}
#toast.on{opacity:1;transform:translate3d(-50%,0,0)}
#fps{position:absolute;right:24px;bottom:18px;z-index:40;font:600 20px/1 ui-monospace,Menlo,Consolas,monospace;color:#7ef0c4;background:rgba(0,0,0,.6);padding:8px 12px;border-radius:8px}

/* launch zoom: sized full-screen once, animated with transform only */
#zoom{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:25;overflow:hidden;opacity:0;pointer-events:none;transform-origin:0 0}
#zoom.go{transition:transform .45s cubic-bezier(.6,0,.2,1),opacity .3s}
#zoom .art svg{height:30%}

/* ---------- context menu ---------- */
#menu{position:absolute;z-index:20;width:440px;padding:12px;border-radius:26px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.6);opacity:0;transform:scale(.94);transform-origin:top left;transition:opacity .18s,transform .18s;pointer-events:none}
#menu.open{opacity:1;transform:none;pointer-events:auto}
#menu .mh{font-size:21px;color:var(--faint);padding:12px 22px 10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi{height:64px;display:flex;align-items:center;padding:0 22px;border-radius:16px;font-size:25px;font-weight:500;color:var(--fg)}
.mi.focus{background:var(--pill);color:var(--pill-ink)}

/* ---------- settings ---------- */
#scrim{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
#scrim.on{opacity:1;pointer-events:auto}
#settings{position:absolute;top:0;right:0;bottom:0;width:700px;background:var(--panel);z-index:10;transform:translate3d(102%,0,0);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#settings.open{transform:none}
#s-head{padding:64px 56px 22px}
#s-head h2{margin:0;font-family:var(--font-display);font-weight:500;font-size:48px;letter-spacing:-.01em}
#s-head p{margin:10px 0 0;color:var(--faint);font-size:21px}
#s-list{flex:1;overflow:hidden;padding:0 28px 60px;position:relative}
.sh{font-family:var(--font-display);font-size:24px;font-weight:500;color:var(--accent);padding:34px 28px 10px}
.si{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-radius:18px;font-size:25px}
.si .v{color:var(--muted);font-size:23px;display:flex;align-items:center}
.si .chev{opacity:0;margin:0 12px;font-size:26px;line-height:1}
.si.focus{background:var(--pill);color:var(--pill-ink)}
.si.focus .v{color:rgba(10,12,17,.7)}
.si.focus .chev{opacity:.55}
.si.pg .chev{opacity:.45;margin-right:0}
.si.pg.focus .chev{opacity:.7}
.tog{width:58px;height:32px;border-radius:999px;background:rgba(255,255,255,.18);position:relative}
.tog::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff}
.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(26px)}
.si.focus .tog{background:rgba(10,12,17,.2)}
.si.focus .tog.on{background:#1b7f5a}
.si>span:first-child{flex:none;margin-right:16px}
/* accent: the chosen colour with its neighbours either side; left/right moves through all of them */
.swc{display:flex;align-items:center}
.sw{width:18px;height:18px;border-radius:50%;margin:0 7px;flex:none;opacity:.45;box-shadow:inset 0 0 0 1px rgba(127,127,127,.5)}
.sw.sel{width:28px;height:28px;opacity:1;box-shadow:0 0 0 3px var(--panel),0 0 0 5px currentColor}
.si.focus .sw.sel{box-shadow:0 0 0 3px var(--pill),0 0 0 5px var(--pill-ink)}
.sw.auto{background:linear-gradient(135deg,#8fd3ff 0%,#8fd3ff 33%,#ffd166 33%,#ffd166 66%,#ff7ad6 66%)!important}
.si .swn{min-width:96px;text-align:right;margin-left:10px}
#stage.boot *{transition:none!important;animation:none!important}
/* photo wallpapers: two cross-fading layers + a static shade for legibility */
.ph,#phShade{position:absolute;left:0;top:0;width:1920px;height:1080px;display:none}
.ph{background-size:cover;background-position:center;opacity:0;transition:opacity 1.4s ease;will-change:opacity}
.ph.on{opacity:1}
.ph.on.kb{animation:drift 70s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1.0)}to{transform:scale(1.08) translate3d(-1.5%,-1%,0)}}
#stage.lite .ph{transition-duration:.4s}
#stage.photo .ph,#stage.photo #phShade{display:block}
#stage.photo .bd{display:none}
#phShade{background-image:linear-gradient(90deg,rgba(4,6,10,.72) 0%,rgba(4,6,10,.3) 40%,rgba(4,6,10,0) 68%),linear-gradient(0deg,rgba(4,6,10,.88) 0%,rgba(4,6,10,.46) 36%,rgba(4,6,10,0) 64%),linear-gradient(180deg,rgba(4,6,10,.5) 0%,rgba(4,6,10,0) 20%)}
#credit{position:absolute;right:96px;top:176px;max-width:620px;text-align:right;z-index:5;color:rgba(255,255,255,.62);font-size:18px;line-height:1.35;text-shadow:0 1px 10px rgba(0,0,0,.7);transition:opacity .3s}
#credit b{display:block;font-weight:600;color:rgba(255,255,255,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#credit span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage.no-clock #credit{top:60px}
#stage.no-clock.has-wx #credit{top:176px}
/* text fields in settings */
.si input.tx{background:transparent;border:0;outline:0;color:inherit;font:inherit;font-size:23px;text-align:right;width:300px;padding:0;caret-color:var(--accent)}
.si.focus input.tx{color:var(--pill-ink)}
.si.editing{box-shadow:inset 0 0 0 3px var(--accent)}
/* monogram shown until an app's icon is confirmed */
.mono{font-family:var(--font-display);font-weight:500;font-size:64px;letter-spacing:-.02em;color:rgba(255,255,255,.92)}
#stage.style-poster .mono{font-size:72px}
#stage.style-icon .mono{font-size:52px}
/* favorites picker */
.pk{display:flex;align-items:center}
.pk-n{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3);margin-left:16px;font-variant-numeric:tabular-nums}
.pk-n.on{background:var(--accent);color:#0a0c11;box-shadow:none}
.si.focus .pk-n{box-shadow:inset 0 0 0 2px rgba(10,12,17,.35)}
.si.focus .pk-n.on{background:#0a0c11;color:var(--pill);box-shadow:none}
.si .sub{font-size:19px;color:var(--faint);margin-left:14px}
.si.focus .sub{color:rgba(10,12,17,.55)}
.si .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:470px}
/* debug console */
#debug{position:absolute;top:0;right:0;bottom:0;width:820px;z-index:60;background:rgba(0,0,0,.9);color:#9dffb0;padding:28px 30px;overflow:hidden;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace}
#debug .dh{color:#fff;font-weight:600;margin-bottom:12px;font-family:var(--font-body);font-size:18px}
#debug pre{margin:0;white-space:pre-wrap;word-break:break-all}
@media (prefers-reduced-motion:reduce){#stage *{animation:none!important;transition-duration:.01s!important}}
</style>

</head>
<body>
<div id="stage" class="fx-lift labels-focus style-landscape">
  <canvas class="bd" id="bdA" width="960" height="540"></canvas>
  <canvas class="bd" id="bdB" width="960" height="540"></canvas>
  <div class="ph" id="phA"></div>
  <div class="ph" id="phB"></div>
  <div id="phShade"></div>
  <div id="credit" hidden></div>

  <div id="hero">
    <h1 id="title" class="hx"></h1>
    <div id="eyebrow" class="hx"></div>
    <div id="desc" class="hx"></div>
  </div>

  <div id="top">
    <div id="wx" hidden><div id="wx-now"><span id="wx-icon"></span><span id="wx-temp"></span></div><div id="wx-range"></div></div>
    <div id="clock"><div id="time"></div><div id="date"></div></div>
    <div class="tbtn" id="tvset" role="button" aria-label="TV settings">
      <svg viewBox="0 0 24 24"><path d="M3 4.5h18v12H3z M8.5 20.5h7 M12 16.5v4"/><path d="M12 8.2a2.3 2.3 0 1 0 0 4.6a2.3 2.3 0 1 0 0-4.6z"/></svg>
      <span class="tl">TV settings</span>
    </div>
    <div class="tbtn" id="gear" role="button" aria-label="Lumen settings">

/* preload, check it's a usable landscape photo, decode, then cross-fade it in */
function wpNext(manual){
  if(!isPhotoMode()||WP.busy) return;
  WP.busy=true;
  wpEnsureList(function(ok){
    if(!ok||!WP.list||!WP.list.length){ WP.busy=false; wpOff(); return; }
    var tries=0, key=WP.key;
    var attempt=function(){
      if(wpKey()!==key){ WP.busy=false; return; }
      if(tries++>=8){ WP.busy=false; dlog('wallpaper: no usable photo after 8 tries'); return; }
      var it=WP.list[WP.i%WP.list.length]; WP.i=(WP.i+1)%WP.list.length;
      writeJSON(key,{t:(readJSON(key)||{}).t||Date.now(),items:WP.list.slice(0,150),i:WP.i});
      var im=new Image();
      im.onload=function(){
        var r=im.naturalWidth/im.naturalHeight;
        if(it.check&&(im.naturalWidth<1600||r<1.25||r>2.8)){ dlog('wallpaper: skipped (not a wide photo)',it.url); return attempt(); }
        var show=function(){ WP.busy=false; wpShow(it,im); };
        if(im.decode) im.decode().then(show,show); else show();
      };
      im.onerror=function(){ dlog('wallpaper: image failed',it.url); attempt(); };
      im.src=it.url;
    };

  });
}
function wpShow(it,im){

  if(S.wpBlur){
    /* frosted look: blurred into the backdrop canvases instead of shown sharp */
    stage.classList.remove('photo');
    bdKey='photo:'+it.url+'|'+S.blur+'|'+S.dim;
    var on=nextCv; on.width=960; on.height=540;
    var x=on.getContext('2d'); x.save(); softDraw(x,960,540,im,Math.max(10,S.blur));
    x.fillStyle='rgba(0,0,0,'+(S.dim/100*.8)+')'; x.fillRect(0,0,960,540); shadeLayer(x,960,540);
    x.fillStyle=noisePattern(x); x.fillRect(0,0,960,540); x.restore();
    fadeTo();
  } else {
    WP.flip=!WP.flip;
    var on2=$(WP.flip?'phA':'phB'), off2=$(WP.flip?'phB':'phA');

    on2.classList.toggle('kb',!!S.wpZoom&&S.quality!=='lite');

}
function wpCredit(){

  c.innerHTML='<b></b><span></span>';

/* ---------- accent ----------
   Auto takes the focused app's own colour (from its icon), brightened and saturated enough to read on
   the dark backdrop; greys fall back to Ice. Changed when the focus settles, never per step. */
var autoAccent=null, curAccent=null;
function setAccent(hex){
  if(hex===curAccent) return; curAccent=hex;
  var c=hexRgb(hex), st=stage.style;
  st.setProperty('--accent',hex);
  st.setProperty('--accent-glow','rgba('+c.join(',')+',.5)');
}
function rgbHex(c){ return '#'+c.map(function(v){ v=Math.max(0,Math.min(255,Math.round(v))); return (v<16?'0':'')+v.toString(16); }).join(''); }
function readableAccent(rgb){
  var r=rgb[0]/255,g=rgb[1]/255,b=rgb[2]/255, mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn, h=0, sat=0;
  if(d){ sat=d/(1-Math.abs(2*l-1)); h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4; h*=60; if(h<0) h+=360; }
  if(sat<.14) return '#8fd3ff';
  sat=Math.max(.55,Math.min(.9,sat)); l=Math.max(.66,Math.min(.78,l));
  var C=(1-Math.abs(2*l-1))*sat, X=C*(1-Math.abs((h/60)%2-1)), m=l-C/2, o;
  o=h<60?[C,X,0]:h<120?[X,C,0]:h<180?[0,C,X]:h<240?[0,X,C]:h<300?[X,0,C]:[C,0,X];
  return rgbHex(o.map(function(v){ return (v+m)*255; }));
}
function updateAutoAccent(a){

  autoAccent=readableAccent(toRgb(palette(a).accent));

/* ---------- Home Assistant row ----------
   Tiles come from http://<address>/local/lumen.json (Home Assistant's www folder, readable on the home
   network without signing in). Each tile POSTs to http://<address>/api/webhook/<id>, which runs the
   webhook automation with that id; webhooks need no token and are local-only by default.
   On the TV both go through root curl: a direct request from the page would be blocked by CORS, and
   for the POST that would mean sending it twice (the browser sends it, then hides the answer). */
var HA=readJSON('lumen.ha.v1')||{}, HA_IDS=[], haBusy=false, haLast=0, haState='';
function haAddr(v){
  v=String(v||'').trim().replace(/^https?:\/\//i,'').replace(/\/.*$/,'');
  if(!/^[A-Za-z0-9.\-]+(:\d{1,5})?$/.test(v)) return '';
  return v.indexOf(':')<0?v+':8123':v;
}
function haBase(){ var a=haAddr(S.haAddr); return a?'http://'+a:''; }
function haMerge(){
  HA_IDS=[];
  if(HA.addr!==haAddr(S.haAddr)) return;
  (HA.tiles||[]).forEach(function(t){
    var id='ha:'+t.webhook, c=HA_COLORS[t.icon]||HA_COLORS.scene;
    var gl={movie:'film'}[t.icon]||t.icon;              /* the guide's icon names → Lumen's glyph names */
    APPS[id]={id:id,title:t.name,glyph:G[gl]?gl:'scene',c1:c[0],c2:c[1],ha:{webhook:t.webhook},
      category:HA.title||'Home Assistant',desc:t.description||'Press OK to run.'};
    HA_IDS.push(id);
  });
}
/* keeps only well-formed tiles; webhook ids become part of a URL and a shell command */
function haTiles(j){
  var out=[];
  ((j&&j.tiles)||[]).forEach(function(t){
    if(!t||typeof t.name!=='string'||!t.name.trim()||typeof t.webhook!=='string'||!/^[A-Za-z0-9_-]{1,100}$/.test(t.webhook)) return;
    if(out.length<30) out.push({name:t.name.trim().slice(0,40),webhook:t.webhook,icon:typeof t.icon==='string'?t.icon:'scene',description:typeof t.description==='string'?t.description.slice(0,160):''});
  });
  return out;
}
function haStatusText(){
  if(!haAddr(S.haAddr)) return S.haAddr?'Address not valid':'Set the address';
  if(haState==='loading') return 'Loading\u2026';
  if(haState==='unreachable') return 'Can\u2019t reach Home Assistant';
  if(haState==='nofile') return 'No www/lumen.json found';
  if(haState==='bad') return 'lumen.json has a mistake';
  var n=HA.addr===haAddr(S.haAddr)?(HA.tiles||[]).length:0;
  return n?n+' tile'+(n===1?'':'s'):'No tiles yet';
}
function haRefreshRow(){
  if(F.zone!=='settings'||F.sub) return;
  if(F.page<0||OPTIONS[F.page].h==='Home Assistant') { var keep=F.sIdx; renderSettings(); F.sIdx=Math.min(keep,sFocusable.length-1); paintSettings(); }
}
function haFetch(url,cb){
  if(ON_TV){
    rootExec('curl -s --max-time 8 -w '+shq('\\n%{http_code}')+' '+shq(url)+' 2>/dev/null || echo 000',function(res,err){
      var t=(res&&res.stdoutString)||'', k=t.lastIndexOf('\n'), code=+t.slice(k+1).trim()||0;
      cb(code, k>-1?t.slice(0,k):'', err);
    });
    return;
  }
  try{ var x=new XMLHttpRequest(); x.open('GET',url,true); x.timeout=8000;
    x.onload=function(){ cb(x.status,x.responseText); }; x.onerror=x.ontimeout=function(){ cb(0,''); }; x.send(); }catch(e){ cb(0,''); }
}
/* reload the tile list: at start, when Lumen comes back (at most once a minute), and from settings */
function haLoad(manual){
  var base=haBase();
  if(!base){ if(manual) toast(S.haAddr?'That address doesn\u2019t look right':'Set Home Assistant\u2019s address first'); haState=''; haRefreshRow(); return; }
  if(haBusy||(!manual&&Date.now()-haLast<60000)) return;
  haBusy=true; haLast=Date.now(); if(manual){ haState='loading'; haRefreshRow(); }
  haFetch(base+'/local/lumen.json?t='+Date.now(),function(code,body,err){
    haBusy=false;
    var j=null; if(code===200){ try{ j=JSON.parse(body); }catch(e){} }
    haState=code===0?'unreachable':code===404?'nofile':code!==200?'unreachable':!j?'bad':'';
    dlog('home assistant: lumen.json -> HTTP '+(code||'no answer')+(err?' ('+err+')':'')+(j?', '+haTiles(j).length+' tiles':''));
    if(j){
      var next={addr:haAddr(S.haAddr),title:typeof j.title==='string'?j.title.slice(0,40):'',tiles:haTiles(j)};
      if(next.tiles.length===0&&(j.tiles||[]).length) haState='bad';
      var changed=JSON.stringify(next)!==JSON.stringify(HA);
      HA=next; writeJSON('lumen.ha.v1',HA);
      if(changed){ haMerge(); render(); }
    }
    if(manual) toast(haState?haStatusText():(HA.tiles.length+' Home Assistant tile'+(HA.tiles.length===1?'':'s')+' loaded'));
    haRefreshRow();
  });
}
function haRun(a){
  var base=haBase();
  if(!base){ toast('Set Home Assistant\u2019s address in Lumen settings'); return; }
  var url=base+'/api/webhook/'+a.ha.webhook;
  dlog('home assistant: run '+a.title);
  var done=function(code,err){
    dlog('home assistant: '+a.title+' -> HTTP '+(code||'no answer')+(err?' ('+err+')':''));
    toast(code>=200&&code<300?a.title+' \u2713':code===0?'Couldn\u2019t reach Home Assistant':'Home Assistant said no ('+code+')');
  };
  if(ON_TV){
    rootExec('curl -s -o /dev/null --max-time 8 -w '+shq('%{http_code}')+' -X POST '+shq(url)+' 2>/dev/null || echo 000',function(res,err){
      done(+String((res&&res.stdoutString)||'').trim()||0,err);
    });
    return;
  }
  if(!ON_DEVICE){ toast(a.title+' \u2014 preview only, no TV connected'); return; }
  /* Android: no root; the request still reaches Home Assistant even when the browser hides the answer */
  try{ var x=new XMLHttpRequest(); x.open('POST',url,true); x.timeout=8000;
    x.onload=function(){ done(x.status); }; x.onerror=function(){ toast(a.title+' sent'); }; x.ontimeout=function(){ done(0); }; x.send(); }catch(e){ done(0); }
}

  var t=h+':'+(m<10?'0':'')+m+(ap?'<span class="ampm">'+ap+'</span>':'');

/* ---------- frame-rate meter ---------- */
var fpsOn=false, fpsFrames=0, fpsT=0;

/* ---------- debug console (0 or blue button) ---------- */

  var d=new Date(), line=(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()+':'+(d.getSeconds()<10?'0':'')+d.getSeconds()+'  '+parts.join(' ');
  LOG.push(line); if(LOG.length>400) LOG.shift();

/* ---------- webOS system calls ---------- */
var bridges=[];
function luna(uri,params,cb){
  if(!ON_TV) return false;
  try{

    b.call(uri,JSON.stringify(params||{}));

    return true;
  }catch(e){ if(cb) cb({returnValue:false,errorText:String(e&&e.message||e)}); return true; }

/* runs a shell command as root through the Homebrew Channel service; cb(result, error) */
function rootExec(cmd,cb){
  return luna('luna://org.webosbrew.hbchannel.service/exec',{command:cmd},function(r){
    if(!r||r.returnValue===false||r.error) cb(null,(r&&(r.errorText||r.error))||'no reply');
    else cb(r,null);
  });
}
function shq(s){ return "'"+String(s).replace(/'/g,"'\\''")+"'"; }
/* call a Luna method: directly first, then as root through the Homebrew Channel if webOS refuses */
function lunaQuery(uri,params,ok,cb){
  var name=uri.split('/').pop();
  luna(uri,params||{},function(r){
    if(r&&r.returnValue!==false&&ok(r)){ dlog(name+': direct call OK'); return cb(r,null); }
    var e1=(r&&r.errorText)||'refused';
    dlog(name+': direct call failed ('+e1+'), trying root');
    rootExec('luna-send -n 1 -w 8000 '+shq(uri)+' '+shq(JSON.stringify(params||{})),function(res,err){
      if(err){ dlog(name+': root failed ('+err+')'); return cb(null,'direct: '+e1+'; root: '+err); }
      var out=res.stdoutString||'', j=null;
      try{ j=JSON.parse(out.slice(out.indexOf('{'))); }catch(e){}
      if(j&&j.returnValue!==false&&ok(j)){ dlog(name+': root call OK'); return cb(j,null); }
      var e2=(j&&j.errorText)||'unreadable reply';
      dlog(name+': root call returned an error ('+e2+')', out.slice(0,200));
      cb(null,'direct: '+e1+'; root: '+e2);
    });
  });
}
function safeId(id){ return /^[A-Za-z0-9._-]+$/.test(id)?id:null; }
function fileUrl(p,folder){

  return 'file://'+(p.charAt(0)==='/'?'':'/')+p;
}
function plainPath(u){ return String(u||'').replace(/^file:\/\//,''); }

/* apps that are never shown: this launcher, old copies, and the launcher it replaces */
var EXCLUDE={'org.webosbrew.lumen':1,'com.lumen.launcher':1,'org.lumen.launcher':1};
var DEFAULT_HIDDEN=['works.partridge.webos-launcher','com.spocky.projengmenu'];
var INPUT_RE=/^com\.webos\.app\.(hdmi\d|externalinput\..*|livetv\.hdmi.*)$/;

function mapLaunchPoint(p){
  var id=p.id||p.appId;
  return {id:id,title:p.title||id,
    icon:fileUrl(p.largeIcon||p.mediumLargeIcon||p.icon,p.folderPath),

    params:p.params||null, system:!!(p.systemApp||p.removable===false), version:p.version};

function appListFrom(r){

/* HDMI inputs from the TV's external-input manager; connected ports only */
function inputListFrom(r){
  var out=[];

    var port=String(d.id||d.port||'');

    var connected=(d.connected===true||d.connected==='true'||d.connectedStatus===true);
    if(d.connected===undefined&&d.connectedStatus===undefined) connected=true;   /* firmware doesn't say: show it */
    if(!connected) return;
    var label=d.userName||d.label||d.deviceName||('HDMI '+n);
    if(label.replace(/\s/g,'').toUpperCase()==='HDMI'+n) label='HDMI '+n;     /* LG's default names: "HDMI2" -> "HDMI 2" */

/* ---------- icon resolution ----------
   1) load the icon file the TV reports  2) the smaller icon  3) read the file as root through the Homebrew Channel.
   Until one works the card shows the app's initials. */
var ICONS={}, ICON_TRY={}, SPLASH_OK={};
var ICON_STORE=readJSON('lumen.icons.v1')||{};
function probe(src,ok,fail){ var im=new Image(); im.onload=function(){ if(im.naturalWidth>0) ok(im); else fail(); }; im.onerror=fail; im.src=src; }
var rootQueue=[], rootBusy=0;
function rootIcon(id,path,cb){
  rootQueue.push([id,path,cb]); pumpRoot();
}
function pumpRoot(){
  while(rootBusy<3&&rootQueue.length){
    (function(job){
      rootBusy++;
      var p=plainPath(job[1]);
      if(!/^[A-Za-z0-9_\/.+@-]+$/.test(p)){ rootBusy--; job[2](null); pumpRoot(); return; }
      rootExec('cat '+shq(p),function(res,err){
        rootBusy--;
        var b64=res&&res.stdoutBytes;
        if(!b64){ dlog('icon: root read failed for',job[0],p,err||'empty file'); job[2](null); }
        else {
          var ext=(p.split('.').pop()||'').toLowerCase();
          var mime=ext==='jpg'||ext==='jpeg'?'image/jpeg':ext==='svg'?'image/svg+xml':ext==='webp'?'image/webp':'image/png';
          job[2]('data:'+mime+';base64,'+b64);
        }
        pumpRoot();
      });
    })(rootQueue.shift());
  }
}
function storeIcon(id,uri){
  ICON_STORE[id]=uri;
  var total=0; for(var k in ICON_STORE) total+=ICON_STORE[k].length;
  if(total<3500000) writeJSON('lumen.icons.v1',ICON_STORE);
}
function resolveIcons(){
  Object.keys(APPS).forEach(function(id){
    var a=APPS[id];
    if(a.demo||a.input||a.ha) return;
    var sig=(a.icon||'')+'|'+(a.splash||'');
    if(ICON_TRY[id]===sig) return; ICON_TRY[id]=sig;
    if(ICON_STORE[id]&&ICON_STORE[id].sig===undefined&&false){}
    var cands=[]; if(a.icon) cands.push(a.icon); if(a.icon2&&a.icon2!==a.icon) cands.push(a.icon2);
    var i=0;
    var next=function(){
      if(i<cands.length){ var s=cands[i++]; probe(s,function(im){ applyIcon(id,s,im); },next); return; }
      if(ICON_STORE[id]){ probe(ICON_STORE[id],function(im){ applyIcon(id,ICON_STORE[id],im,true); dlog('icon: using saved copy for',id); },function(){ delete ICON_STORE[id]; }); return; }
      if(!cands.length){ if(!a.input) dlog('icon: TV reports no icon for',id); return; }
      dlog('icon: file blocked for',id,'- reading it as root');
      rootIcon(id,cands[0],function(uri){
        if(!uri) return;
        probe(uri,function(im){ storeIcon(id,uri); applyIcon(id,uri,im,true); },function(){ dlog('icon: root copy is not an image for',id); });
      });
    };
    next();
    if(a.splash&&S.splash) probe(a.splash,function(){ SPLASH_OK[id]=true; applySplash(id); },function(){ dlog('artwork: not loadable for',id); });
  });
}
function cardArts(id){ return $('rows').querySelectorAll('.art[data-id="'+id+'"]'); }
/* Reads an icon's colours: the colour around its edge, and its main logo colour.
   'seam'  = solid square background -> the card takes that colour so the square disappears
   'tile'  = busy/photographic edge  -> shown as a rounded tile
   'clear' = transparent icon        -> floats on a gradient of its own colour
   Throws if webOS won't let the page read the image's pixels. */
var COLORS=readJSON('lumen.colors.v1')||{};
function analyzeIcon(img){
  var N=40, c=document.createElement('canvas'); c.width=c.height=N;
  var x=c.getContext('2d'); x.drawImage(img,0,0,N,N);
  var d=x.getImageData(0,0,N,N).data, eN=0, aSum=0, border=[], i, y, k;
  for(y=0;y<N;y++) for(i=0;i<N;i++){
    if(!(i<3||y<3||i>=N-3||y>=N-3)) continue;
    if((i<12||i>=N-12)&&(y<12||y>=N-12)) continue;        /* skip rounded corners */
    k=(y*N+i)*4; eN++; aSum+=d[k+3];
    if(d[k+3]>200) border.push([d[k],d[k+1],d[k+2]]);
  }
  var edge=null, mode='clear';
  if(aSum/eN/255>.85&&border.length>eN*.8){
    edge=[0,0,0]; border.forEach(function(p){ edge[0]+=p[0]; edge[1]+=p[1]; edge[2]+=p[2]; });
    edge=edge.map(function(v){ return Math.round(v/border.length); });
    var dev=0; border.forEach(function(p){ dev+=Math.abs(p[0]-edge[0])+Math.abs(p[1]-edge[1])+Math.abs(p[2]-edge[2]); });
    mode=dev/border.length<24?'seam':'tile';
  }
  var ws=0, ac=[0,0,0];
  for(y=3;y<N-3;y++) for(i=3;i<N-3;i++){
    k=(y*N+i)*4; if(d[k+3]<160) continue;
    var px=[d[k],d[k+1],d[k+2]], mx=Math.max(px[0],px[1],px[2]), s=satOf(px);
    var dist=edge?(Math.abs(px[0]-edge[0])+Math.abs(px[1]-edge[1])+Math.abs(px[2]-edge[2]))/765:1;
    var w=(s*s+.02)*(dist+.05)*(mx/255+.2);
    ws+=w; ac[0]+=px[0]*w; ac[1]+=px[1]*w; ac[2]+=px[2]*w;
  }
  var accent=ws?ac.map(function(v){ return Math.round(v/ws); }):(edge||[90,100,120]);
  return {mode:mode,edge:edge||mixA(accent,[8,10,14],.6),accent:accent};
}
function iconMode(id){ var p=COLORS[id]; return p?p.mode:'clear'; }
function applyIcon(id,src,img,fromRoot){
  var a=APPS[id]; if(!a) return;
  var sig=a.icon||'';
  var p=COLORS[id];
  if(img&&!(p&&p.sig===sig)){
    try{ p=analyzeIcon(img); p.sig=sig; COLORS[id]=p; writeJSON('lumen.colors.v1',COLORS); }
    catch(e){
      if(!fromRoot&&!/^data:/.test(src)){
        dlog('icon: colours unreadable for',id,'- reading the file as root');
        rootIcon(id,src,function(uri){ if(uri) probe(uri,function(im){ storeIcon(id,uri); applyIcon(id,uri,im,true); },function(){}); });
      }
    }
  }
  ICONS[id]=src;

}
function paintCards(id){
  var a=APPS[id], src=ICONS[id], mode=src?iconMode(id):'';

    if(el.classList.contains('nm')) return;

    el.className='art '+mode+(spl?' splash':'');

  });
}
function applySplash(id){
  if(!S.splash||S.cardStyle==='icon') return;
  var a=APPS[id]; if(!a||(a.banner&&S.cardStyle!=='landscape')) return;
  Array.prototype.forEach.call(cardArts(id),function(el){ el.style.backgroundImage='url("'+a.splash+'")'; el.classList.add('splash'); });
  if(heroId===id&&S.wallpaper==='focus'){ bdKey=null; paintBackdrop(a); }

function loadTvApps(manual){

  var pending=2, apps=null, inputs=null, errs=[];
  var done=function(){
    if(--pending>0) return;

      apps=ALL.map(function(id){ return APPS[id]; });
    }
    if(!inputs&&SOURCE==='tv') inputs=INPUTS.map(function(id){ return APPS[id]; });

      return;

    setApps(demoApps(),'demo'); render();

  };
  /* apps: launch points first (what LG's home bar shows), full app list as a fallback */
  lunaQuery('luna://com.webos.applicationManager/listLaunchPoints',{},function(r){ return !!r.launchPoints; },function(r,err){
    if(r){ apps=appListFrom(r); dlog('apps: '+apps.length+' from launch points'); return done(); }
    errs.push('launch points: '+err);
    lunaQuery('luna://com.webos.applicationManager/listApps',{},function(r){ return !!r.apps; },function(r2,err2){
      if(r2){ apps=appListFrom(r2); dlog('apps: '+apps.length+' from app list'); }
      else errs.push('app list: '+err2);

    });
  });

  lunaQuery('luna://com.webos.service.eim/getAllInputStatus',{},function(r){ return !!(r.devices||r.inputs); },function(r,err){
    if(r){ inputs=inputListFrom(r); dlog('inputs: '+inputs.length+' connected HDMI', (r.devices||r.inputs||[]).map(function(d){ return (d.id||d.port)+'='+(d.connected!==undefined?d.connected:'?'); }).join(', ')); }
    else dlog('inputs: could not read input list ('+err+')');

  });

var toastT=null;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on');},2800); }
function stageRect(el){ var sr=stage.getBoundingClientRect(), r=el.getBoundingClientRect(); return {l:(r.left-sr.left)/SCALE,t:(r.top-sr.top)/SCALE,w:r.width/SCALE,h:r.height/SCALE}; }
function hideZoom(){ var z=$('zoom'); z.classList.remove('go'); z.style.opacity='0'; }
function launch(id){

        });

/* a Luna call that falls back to root; cb(ok, error text). Root replies are read from luna-send's output. */
function lunaDo(uri,params,cb){
  luna(uri,params,function(res){
    if(res&&res.returnValue!==false) return cb(true,null);
    var e1=(res&&res.errorText)||'refused';
    dlog(uri.split('/').pop()+' refused ('+e1+'), trying root');
    rootExec('luna-send -n 1 -w 5000 '+shq(uri)+' '+shq(JSON.stringify(params||{})),function(out,err){
      if(err) return cb(false,e1+'; root: '+err);
      var t=out.stdoutString||'';
      if(/"returnValue"\s*:\s*false/.test(t)){ var m=/"errorText"\s*:\s*"([^"]*)"/.exec(t); return cb(false,e1+'; root: '+(m?m[1]:'refused')); }

}

  if(o.key==='_nextwp') return 'OK, or the green button';
  if(o.key==='_haReload') return esc(haStatusText());
  if(o.text) return '<input class="tx" id="in-'+o.key+'" type="text" value="'+esc(v||'')+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+' spellcheck="false" autocomplete="off" tabindex="-1">';
  if(o.bool) return '<span class="tog'+(v?' on':'')+'"></span>';
  if(o.swatch){
    var n=o.swatch.length, at=0; for(var q=0;q<n;q++) if(o.swatch[q][0]===v) at=q;
    var dot=function(k,sel){ var w=o.swatch[(k+n)%n]; return '<span class="sw'+(sel?' sel':'')+(w[0]==='auto'?' auto':'')+'" style="background:'+(w[0]==='auto'?'#fff':w[0])+';color:'+(w[0]==='auto'?'#fff':w[0])+'"></span>'; };
    return '<span class="chev">&#8249;</span><span class="swc">'+dot(at-1)+dot(at,1)+dot(at+1)+'</span><span class="swn">'+esc(o.swatch[at][1])+'</span><span class="chev">&#8250;</span>';
  }
  if(o.range) return '<span class="chev">&#8249;</span>'+o.fmt(v)+'<span class="chev">&#8250;</span>';
  for(var i=0;i<o.values.length;i++) if(o.values[i][0]===v) return '<span class="chev">&#8249;</span>'+o.values[i][1]+'<span class="chev">&#8250;</span>';
  return '';
}
function setHead(t,sub){ $('s-head').innerHTML='<h2>'+esc(t)+'</h2><p>'+esc(sub)+'</p>'; }
function renderSettings(){
  var L=$('s-list'), html=''; sFocusable=[];
  if(F.page<0){
    setHead('Lumen settings','Changes apply as you go. Back to close.');
    OPTIONS.forEach(function(o,i){
      if(!o.h||(o.when&&!o.when())) return;
      sFocusable.push(i);
      html+='<div class="si pg"><span>'+esc(o.h)+'</span><span class="v">'+esc(o.sum())+'<span class="chev">&#8250;</span></span></div>';
    });
  } else {
    setHead(OPTIONS[F.page].h,'Back to all settings.');
    for(var i=F.page+1;i<OPTIONS.length&&!OPTIONS[i].h;i++){
      var o=OPTIONS[i]; if(o.when&&!o.when()) continue;
      sFocusable.push(i);
      html+='<div class="si" data-o="'+i+'"><span>'+o.label+'</span><span class="v">'+optValue(o)+'</span></div>';
    }
  }
  L.innerHTML=html;
  sItems=L.querySelectorAll('.si');
  Array.prototype.forEach.call(sItems,function(el,k){
    el.addEventListener('mouseenter',function(){ F.sIdx=k; paintSettings(); });
    el.addEventListener('click',function(){ F.sIdx=k; paintSettings(); changeOpt(1,true); });
  });
  F.sLast=-1; paintSettings();
}
function paintSettings(){
  if(F.sLast>=0&&sItems[F.sLast]) sItems[F.sLast].classList.remove('focus');
  var el=sItems[F.sIdx], L=$('s-list');
  if(el){ el.classList.add('focus'); L.scrollTop=Math.max(0,el.offsetTop-L.clientHeight/2+38); }
  F.sLast=F.sIdx;
}
function refreshOpt(){ var el=sItems[F.sIdx], o=OPTIONS[sFocusable[F.sIdx]]; if(el) el.querySelector('.v').innerHTML=optValue(o); }
var RERENDER={cardStyle:1,cardSize:1,bigFav:1,splash:1,scroll:1,hero:1,rowTitles:1,haRow:1};
function openPage(i){ F.page=i; F.lastPage=i; F.sIdx=0; renderSettings(); }
function closePage(){ var p=F.page; F.page=-1; renderSettings(); F.sIdx=Math.max(0,sFocusable.indexOf(p)); paintSettings(); }
function changeOpt(dir,isOk){
  var o=OPTIONS[sFocusable[F.sIdx]];
  if(!o) return;
  if(o.h){ if(isOk||dir>0) openPage(sFocusable[F.sIdx]); return; }
  if(o.action){
    if(!isOk) return;
    if(o.key==='_favs'){ openFavPicker(); return; }
    if(o.key==='_nextwp'){ toast('Loading the next wallpaper…'); wpNext(true); return; }
    if(o.key==='_debug'){ toggleDebug(); return; }
    if(o.key==='_haReload'){ haLoad(true); return; }
    if(o.key==='_home'){ try{ window.LumenAndroid.chooseHomeApp(); }catch(e){} return; }
    if(o.key==='_refresh'){ if(ON_DEVICE){ toast('Reloading apps…'); loadTvApps(true); } }
    if(o.key==='_hidden'){ if((S.hidden||[]).length){ S.hidden=[]; saveS(); render(); toast('All apps are visible again'); } }
    if(o.key==='_reset'){
      if(!resetArmed){ resetArmed=true; clearTimeout(resetT); resetT=setTimeout(function(){resetArmed=false; refreshOpt();},3500); }
      else { resetArmed=false; var keep={favorites:S.favorites,favSource:S.favSource,order:S.order,hidden:S.hidden}; S=Object.assign({},DEFAULTS,keep); saveS(); applySettings(); render(); renderSettings(); toast('Settings reset'); return; }
    }
    refreshOpt(); return;
  }
  if(o.text){ if(isOk) startEdit(o.key); return; }
  var v=S[o.key];
  if(o.bool){ S[o.key]=!v; }
  else if(o.range){ var lo=o.range[0],hi=o.range[1],st=o.range[2]; var nv=v+dir*st; if(isOk&&nv>hi) nv=lo; S[o.key]=Math.max(lo,Math.min(hi,nv)); }
  else { var arr=o.swatch||o.values, idx=0; for(var i=0;i<arr.length;i++) if(arr[i][0]===v) idx=i; S[o.key]=arr[(idx+dir+arr.length)%arr.length][0]; }
  saveS(); applySettings();
  if(RERENDER[o.key]) render(); else applyFocus(true);
  if(o.key==='wallpaper'||o.key==='wpRes'||o.key==='wpBlur'){ if(o.key==='wallpaper') WP.on&&!isPhotoMode()&&wpOff(); bdKey=null; wpApply(true); }
  else if(o.key==='wpCredit'||o.key==='dim'||o.key==='wpZoom'){ wpApply(false); if(o.key==='wpZoom'){ var cur=$(WP.flip?'phA':'phB'); cur.classList.toggle('kb',!!S.wpZoom&&S.quality!=='lite'); } }
  paintBackdrop(heroId?APPS[heroId]:null);
  if(o.key==='weather'||o.key==='wxUnits') wxRefresh(true);
  if(o.key==='wallpaper'||o.key==='weather'){ var keep=o.key; renderSettings(); for(var q=0;q<sFocusable.length;q++) if(OPTIONS[sFocusable[q]].key===keep){ F.sIdx=q; break; } paintSettings(); return; }
  refreshOpt();
}
/* text settings: focusing the field brings up the TV's on-screen keyboard; OK/Enter saves, Back cancels */
function startEdit(key){
  var inp=$('in-'+key); if(!inp) return;
  F.editing=key; F.editOld=S[key];
  inp.parentNode.parentNode.classList.add('editing');
  inp.removeAttribute('tabindex'); inp.focus();
  try{ inp.setSelectionRange(0,inp.value.length); }catch(e){}
}
function endEdit(save){
  var key=F.editing; if(!key) return;
  var inp=$('in-'+key); F.editing=null;
  if(inp){
    inp.parentNode.parentNode.classList.remove('editing'); inp.blur(); inp.setAttribute('tabindex','-1');
    var val=String(inp.value||'').trim();
    if(key==='wpSub') val=val.replace(/^\/?r\//i,'').replace(/\s+/g,'');
    if(key==='haAddr'){ if(save){ S.haAddr=haAddr(val); saveS(); inp.value=S.haAddr; haLoad(true); } else inp.value=F.editOld||''; return; }
    if(key==='wxPlace'){ if(save&&val) wxSetPlace(val,inp); else inp.value=F.editOld||''; return; }
    if(save&&val&&val!==F.editOld){ S[key]=val; saveS(); inp.value=val; bdKey=null; wpApply(true); toast('Loading wallpapers for '+(key==='wpSub'?'r/':'')+val); }
    else inp.value=F.editOld||'';
  }
}
function openSettings(){ $('top').style.opacity='0'; F.prevZone=F.zone==='top'?'top':'rows'; F.zone='settings'; F.page=-1; renderSettings(); F.sIdx=Math.max(0,sFocusable.indexOf(F.lastPage)); paintSettings(); $('settings').classList.add('open'); $('scrim').classList.add('on'); applyFocus(); }
function closeSettings(){ if(F.sub) closeFavPicker(); $('top').style.opacity=''; $('settings').classList.remove('open'); $('scrim').classList.remove('on'); F.zone=F.prevZone||'rows'; applyFocus(); }


/* ---------- choose favorites ---------- */
var pkIds=[], pkReturn=0;
function openFavPicker(){
  pkReturn=F.sIdx; F.sub='fav';
  var favs=(S.favorites||[]).filter(function(id){ return APPS[id]&&!isHidden(id); });
  var rest=INPUTS.concat(orderedAll()).filter(function(id){ return favs.indexOf(id)<0&&!isHidden(id); });
  pkIds=favs.concat(rest);
  $('s-head').innerHTML='<h2>Choose favorites</h2><p>OK adds or removes. Numbers are the order on the home screen.</p>';
  var html='';
  pkIds.forEach(function(id){
    var a=APPS[id];
    html+='<div class="si"><span class="pk"><span class="nm">'+esc(a.title)+'</span>'+(a.input?'<span class="sub">Input</span>':'')+'</span><span class="pk-n"></span></div>';
  });
  if(!pkIds.length) html='<div class="sh">No apps loaded yet</div>';
  $('s-list').innerHTML=html;
  sItems=$('s-list').querySelectorAll('.si');
  Array.prototype.forEach.call(sItems,function(el,k){
    el.addEventListener('mouseenter',function(){ F.sIdx=k; paintSettings(); });
    el.addEventListener('click',function(){ F.sIdx=k; paintSettings(); togglePick(); });
  });
  F.sIdx=0; F.sLast=-1; paintPicks(); paintSettings();
}
function paintPicks(){
  var favs=S.favorites||[];
  Array.prototype.forEach.call(sItems,function(el,k){
    var n=favs.indexOf(pkIds[k]), b=el.lastChild;
    b.className='pk-n'+(n>-1?' on':''); b.textContent=n>-1?(n+1):'';
  });
}
function togglePick(){
  var id=pkIds[F.sIdx]; if(!id) return;
  S.favorites=(S.favorites||[]).filter(function(x){ return APPS[x]; });
  var i=S.favorites.indexOf(id);
  if(i>-1) S.favorites.splice(i,1); else S.favorites.push(id);
  saveS(); paintPicks();
}
function closeFavPicker(){
  F.sub=null;
  renderSettings(); F.sIdx=pkReturn; paintSettings();
  render();
}

/* ---------- input ---------- */
var K={LEFT:37,UP:38,RIGHT:39,DOWN:40,OK:13,BACK:461,ESC:27,BKSP:8,RED:403,YELLOW:405};
var okTimer=null, holdFired=false, okDown=false;
function onOk(){
  if(F.zone==='rows'){ if(!rows.length) return; if(F.moving) endMove(); else launch(rows[F.row].ids[col()]); }
  else if(F.zone==='top'){ if(F.top===0) openTvSettings(); else openSettings(); }
  else if(F.zone==='peek'){ F.zone='rows'; applyFocus(); }
  else if(F.zone==='menu') menuItems[F.mIdx].act();
  else if(F.zone==='settings'){ if(F.sub) togglePick(); else changeOpt(1,true); }
}
function onHold(){ if(F.zone==='rows'&&!F.moving) openMenu(); else onOk(); }
function onBack(){
  if(!$('debug').hidden){ toggleDebug(); return; }
  if(F.zone==='settings'&&F.sub) closeFavPicker();
  else if(F.zone==='settings'&&F.page>=0) closePage();
  else if(F.zone==='settings') closeSettings();
  else if(F.zone==='menu'){ closeMenu(); applyFocus(); }
  else if(F.moving) endMove();
  else if(F.zone==='top'||F.zone==='peek'){ F.zone=rows.length?'rows':'top'; applyFocus(); }
  else if(F.zone==='rows'&&rows.length&&(F.row>0||col()>0)){ F.row=0; F.cols[rows[0].key]=0; applyFocus(); }
}
function nav(k){
  if(F.zone==='settings'&&F.sub){
    if(k===K.UP) F.sIdx=Math.max(0,F.sIdx-1);
    else if(k===K.DOWN) F.sIdx=Math.min(sItems.length-1,F.sIdx+1);
    paintSettings(); return;
  }
  if(F.zone==='settings'){
    if(k===K.UP) F.sIdx=Math.max(0,F.sIdx-1);
    else if(k===K.DOWN) F.sIdx=Math.min(sFocusable.length-1,F.sIdx+1);
    else if(k===K.LEFT) return changeOpt(-1);
    else if(k===K.RIGHT) return changeOpt(1);
    if(resetArmed){ resetArmed=false; refreshOpt(); }
    paintSettings(); return;
  }
  if(F.zone==='menu'){
    if(k===K.UP) F.mIdx=Math.max(0,F.mIdx-1);
    if(k===K.DOWN) F.mIdx=Math.min(menuItems.length-1,F.mIdx+1);
    paintMenu(); return;
  }
  if(F.zone==='peek'){
    if(k===K.UP){ F.zone='top'; F.top=1; applyFocus(); }
    else if(k===K.DOWN){ F.zone='rows'; applyFocus(); }
    return;
  }
  if(F.zone==='top'){
    if(k===K.DOWN&&rows.length){ F.zone='peek'; applyFocus(); }
    else if(k===K.LEFT&&F.top>0){ F.top--; applyFocus(); }
    else if(k===K.RIGHT&&F.top<1){ F.top++; applyFocus(); }
    return;
  }
  if(!rows.length){ if(k===K.UP){ F.zone='top'; F.top=1; applyFocus(); } return; }
  if(F.moving){ if(k===K.LEFT) moveBy(-1); else if(k===K.RIGHT) moveBy(1); return; }
  var r=rows[F.row], c=col();
  if(k===K.LEFT&&c>0) F.cols[r.key]=c-1;
  else if(k===K.RIGHT&&c<r.ids.length-1) F.cols[r.key]=c+1;
  else if(k===K.UP){ if(F.row>0) F.row--; else F.zone='peek'; }
  else if(k===K.DOWN&&F.row<rows.length-1) F.row++;
  else return;
  var t=now();
  if(t-lastNav<280){ if(!gliding){ gliding=true; stage.classList.add('glide'); } clearTimeout(glideT); glideT=setTimeout(endGlide,300); }
  applyFocus();
  lastNav=t;
}
var gliding=false, glideT=null;
function endGlide(){ gliding=false; stage.classList.remove('glide'); }
var lastRepeat=0;
document.addEventListener('keydown',function(e){
  var k=e.keyCode;
  if(F.editing){
    if(k===K.OK){ e.preventDefault(); F.skipOkUp=true; endEdit(true); }
    else if(k===K.BACK||k===K.ESC){ e.preventDefault(); endEdit(false); }
    return;                                      /* let the keyboard handle everything else */
  }
  if(k===404){ e.preventDefault(); if(isPhotoMode()){ toast('Loading the next wallpaper…'); wpNext(true); } return; }
  if(k===K.OK){ e.preventDefault(); if(okDown) return; okDown=true; holdFired=false; okTimer=setTimeout(function(){ holdFired=true; onHold(); },550); return; }
  if(k===K.BACK||k===K.ESC||k===K.BKSP){ e.preventDefault(); onBack(); return; }
  if(k===48||k===96||k===406){ e.preventDefault(); toggleDebug(); return; }
  if(k===K.RED){ e.preventDefault(); if(F.zone==='settings') closeSettings(); else openSettings(); return; }
  if(k===K.YELLOW||e.key==='ContextMenu'){ e.preventDefault(); if(F.zone==='rows') openMenu(); return; }
  if(k>=37&&k<=40){
    e.preventDefault();
    /* holding an arrow: cap the repeat rate so the TV isn't asked for more than it can draw */
    if(e.repeat){ var t=now(); if(t-lastRepeat<(S.quality==='lite'?70:110)) return; lastRepeat=t; }
    nav(k);
  }
});
document.addEventListener('keyup',function(e){
  if(e.keyCode===K.OK){ if(F.skipOkUp||F.editing){ F.skipOkUp=false; okDown=false; return; } okDown=false; clearTimeout(okTimer); if(!holdFired) onOk(); }
  if(e.keyCode>=37&&e.keyCode<=40&&heroId){ clearTimeout(bdTimer); bdTimer=setTimeout(function(){ paintBackdrop(APPS[heroId]); },S.quality==='lite'?120:200); }
});

/* pointer (Magic Remote / mouse): delegated, one set of listeners */
var tiltOn=false;
function cardFrom(t){ while(t&&t!==stage){ if(t.classList&&t.classList.contains('card')) return t; t=t.parentNode; } return null; }
$('rows').addEventListener('mouseover',function(e){
  var c=cardFrom(e.target); if(!c||F.moving) return;
  if(F.zone!=='rows'&&F.zone!=='top'&&F.zone!=='peek') return;
  var ri=+c.getAttribute('data-r'), ci=+c.getAttribute('data-c');
  if(ri===F.row&&ci===col()&&F.zone==='rows') return;
  F.zone='rows'; F.row=ri; F.cols[rows[ri].key]=ci;
  var keep=S.scroll; S.scroll='free'; applyFocus(); S.scroll=keep;
});
var tiltRaf=0, tiltEvt=null;
$('rows').addEventListener('mousemove',function(e){
  if(!S.parallax||S.quality==='lite'||!focusedCard) return;
  if(!tiltOn){ tiltOn=true; stage.classList.add('tilt'); }
  tiltEvt=e;
  if(!tiltRaf) tiltRaf=requestAnimationFrame(function(){
    tiltRaf=0; if(!focusedCard||!tiltEvt) return;
    var f=focusedCard.querySelector('.lift'), r=f.getBoundingClientRect();
    var x=Math.max(-.5,Math.min(.5,(tiltEvt.clientX-r.left)/r.width-.5)), y=Math.max(-.5,Math.min(.5,(tiltEvt.clientY-r.top)/r.height-.5));
    f.style.setProperty('--ry',(x*12)+'deg'); f.style.setProperty('--rx',(-y*10)+'deg');
  });
});
$('rows').addEventListener('mouseleave',function(){ if(focusedCard){ var f=focusedCard.querySelector('.lift'); f.style.setProperty('--rx','0deg'); f.style.setProperty('--ry','0deg'); } });
$('rows').addEventListener('click',function(e){
  var c=cardFrom(e.target); if(!c) return;
  if(F.zone==='menu'){ closeMenu(); applyFocus(); return; }
  if(F.zone!=='rows') return;
  if(F.moving){ endMove(); return; }
  launch(rows[F.row].ids[col()]);
});
$('rows').addEventListener('contextmenu',function(e){ e.preventDefault(); if(F.zone==='rows'&&!F.moving) openMenu(); });
$('gear').addEventListener('click',openSettings);
$('tvset').addEventListener('click',openTvSettings);
['tvset','gear'].forEach(function(n,i){ $(n).addEventListener('mouseenter',function(){ if(F.zone==='rows'||F.zone==='top'){ F.zone='top'; F.top=i; applyFocus(); } }); });
$('scrim').addEventListener('click',closeSettings);
stage.addEventListener('click',function(e){ if(F.zone==='menu'&&!$('menu').contains(e.target)){ closeMenu(); applyFocus(); } });

/* back in front (Home button / relaunch): reset view, refresh app list quietly */
function onReturn(){ hideZoom(); tick(); wxRefresh(false); haLoad(false); if(ON_DEVICE) loadTvApps(false); }
/* handlesRelaunch is on, so webOS leaves it to the app to come to the front when launched again */
function bringToFront(){
  try{ if(window.webOSSystem&&typeof webOSSystem.activate==='function'){ webOSSystem.activate(); return 'webOSSystem'; } }catch(e){}
  try{ if(window.PalmSystem&&typeof PalmSystem.activate==='function'){ PalmSystem.activate(); return 'PalmSystem'; } }catch(e){}
  return 'none';
}
document.addEventListener('webOSRelaunch',function(){
  if(ON_ANDROID) dlog('Home pressed'); else dlog('relaunched - bringing Lumen to the front via',bringToFront());
  if(F.zone==='settings') closeSettings(); closeMenu(); F.moving=null; F.zone='rows'; applyFocus(true); onReturn();
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden) onReturn(); });

/* ---------- fit stage ---------- */
/* at the TV's own 1920x1080 the stage is placed with no transform at all, so nothing is resampled every frame */
function fit(){
  SCALE=Math.min(window.innerWidth/1920,window.innerHeight/1080);
  if(Math.abs(SCALE-1)<.001){ SCALE=1; stage.style.left=stage.style.top='0'; stage.style.transform='none'; }
  else { stage.style.left=stage.style.top=''; stage.style.transform='translate(-50%,-50%) scale('+SCALE+')'; }
}
window.addEventListener('resize',fit);

/* ---------- boot ---------- */
stage.classList.add('boot');
fit(); applySettings(); renderHints();
/* hooks the Android shell calls for keys and events webOS handles differently */
window.lumenBack=function(){ onBack(); };
window.lumenMenu=function(){ if(F.zone==='rows'&&!F.moving) openMenu(); else if(F.zone==='menu'){ closeMenu(); applyFocus(); } };
window.lumenAppsChanged=function(){ loadTvApps(false); };
window.toastFromAndroid=function(m){ hideZoom(); toast(m); };
window.lumenHome=function(){ var e=document.createEvent('Event'); e.initEvent('webOSRelaunch',true,true); document.dispatchEvent(e); };
if(ON_DEVICE){
  var cached=readJSON(AKEY);
  dlog('Lumen '+LUMEN_VERSION+' starting'+(ON_ANDROID?' (Android TV)':'')+', window '+window.innerWidth+'x'+window.innerHeight+' @'+(window.devicePixelRatio||1)+'x');
  if(ON_ANDROID){ try{ dlog('device: '+window.LumenAndroid.deviceInfo()); }catch(e){} }
  if(cached&&cached.length){ appSig=JSON.stringify(cached); setApps(cached,'tv'); render(); resolveIcons(); dlog('showing '+cached.length+' saved apps while refreshing'); }   /* instant start from last known list */
  else render();                                                                             /* "Loading your apps" */
  loadTvApps(false);
  setTimeout(function(){ if(SOURCE==='none'&&loading) banner('Still reading your app list…',0); },6000);
} else {
  setApps(demoApps(),'demo'); render();
}
/* wallpapers: show the last photo straight away (browser cache), rotation continues from there */
$('phShade').style.backgroundColor='rgba(0,0,0,'+(S.dim/100*.8)+')';
if(isPhotoMode()){
  var last=S.wpLast;
  if(last&&last.mode===S.wallpaper&&last.url){
    var bim=new Image();
    bim.onload=function(){ wpShow(last,bim); WP.shownAt=Date.now(); };
    bim.onerror=function(){ wpNext(); };
    bim.src=last.url;
  } else wpNext();
}
wxRefresh(false); haLoad(false);
requestAnimationFrame(function(){ requestAnimationFrame(function(){ stage.classList.remove('boot'); }); });
})();
</script>
